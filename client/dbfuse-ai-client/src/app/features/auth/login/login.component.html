<div class="h-full flex items-center justify-center bg-background py-12 px-4 sm:px-6 lg:px-8 overflow-auto scrollbar-hidden">
    <div class="max-w-md w-full space-y-8">
        <!-- Header Section -->
        <div class="text-center">
            <div class="flex justify-center mb-6">
                <app-logo></app-logo>
            </div>
            <h2 class="text-3xl font-bold text-foreground mb-2">Welcome back</h2>
            <p class="text-sm text-muted-foreground">Sign in to your DBFuse AI account</p>
        </div>

        <!-- Login Form -->
        <div class="ui-card py-8 px-6">
            <form
                [formGroup]="loginForm"
                (ngSubmit)="onSubmit()"
                class="space-y-6"
            >
                <!-- Username Field -->
                <div>
                    <label
                        for="username"
                        class="block text-sm font-medium text-muted-foreground mb-2"
                    >
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        formControlName="username"
                        placeholder="Enter your username"
                        [class]="getInputClasses()"
                        [disabled]="isLoading"
                    />
                    <div
                        *ngIf="loginForm?.get('username')?.invalid && loginForm?.get('username')?.touched"
                        class="mt-1 text-sm text-destructive"
                    >
                        Username is required
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label
                        for="password"
                        class="block text-sm font-medium text-muted-foreground mb-2"
                    >
                        Password
                    </label>
                    <div class="relative">
                        <input
                            [type]="showPassword ? 'text' : 'password'"
                            id="password"
                            formControlName="password"
                            placeholder="Enter your password"
                            [class]="getInputClasses()"
                            [disabled]="isLoading"
                        />
                        <button
                            type="button"
                            (click)="togglePasswordVisibility()"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-muted-foreground hover:text-foreground transition-colors duration-200"
                            [disabled]="isLoading"
                        >
                            <svg
                                *ngIf="!showPassword"
                                class="h-5 w-5"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                                ></path>
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                                ></path>
                            </svg>
                            <svg
                                *ngIf="showPassword"
                                class="h-5 w-5"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"
                                ></path>
                            </svg>
                        </button>
                    </div>
                    <div
                        *ngIf="loginForm?.get('password')?.invalid && loginForm?.get('password')?.touched"
                        class="mt-1 text-sm text-destructive"
                    >
                        Password is required
                    </div>
                </div>

                <!-- Error Message -->
                <div
                    *ngIf="errorMessage"
                    class="border border-destructive/30 bg-destructive/10 rounded-lg p-3"
                >
                    <div class="flex items-center">
                        <svg
                            class="h-5 w-5 text-destructive mr-2"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                            ></path>
                        </svg>
                        <span class="text-sm text-destructive">{{ errorMessage }}</span>
                    </div>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    [disabled]="!loginForm?.valid || isLoading"
                    class="btn btn-primary w-full justify-center gap-2"
                >
                    <span
                        *ngIf="!isLoading"
                        class="flex items-center"
                    >
                        <svg
                            class="w-4 h-4 mr-2"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"
                            ></path>
                        </svg>
                        Sign in
                    </span>

                    <span
                        *ngIf="isLoading"
                        class="flex items-center"
                    >
                        <svg
                            class="animate-spin h-4 w-4 mr-2"
                            fill="none"
                            viewBox="0 0 24 24"
                        >
                            <circle
                                class="opacity-25"
                                cx="12"
                                cy="12"
                                r="10"
                                stroke="currentColor"
                                stroke-width="4"
                            ></circle>
                            <path
                                class="opacity-75"
                                fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                            ></path>
                        </svg>
                        Signing in...
                    </span>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="text-center">
            <p class="text-xs text-muted-foreground">Open source AI Integrated database management tool</p>
            <div class="flex justify-center space-x-4 mt-2">
                <a
                    href="https://github.com/kshashikumar/dbfuse-ai"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="text-xs text-muted-foreground hover:text-foreground transition-colors duration-200"
                >
                    GitHub
                </a>
                <span class="text-muted-foreground">|</span>
                <a
                    href="https://hub.docker.com/r/shashikumarkasturi/dbfuse-ai"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="text-xs text-muted-foreground hover:text-foreground transition-colors duration-200"
                >
                    Docker Hub
                </a>
                <span class="text-muted-foreground">|</span>
                <a
                    href="https://www.npmjs.com/package/dbfuse-ai"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="text-xs text-muted-foreground hover:text-foreground transition-colors duration-200"
                >
                    NPM
                </a>
            </div>
        </div>
    </div>
</div>
