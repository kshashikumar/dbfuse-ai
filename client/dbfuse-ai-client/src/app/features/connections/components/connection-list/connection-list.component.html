<!-- Connections -->
<div
    *ngIf="connections.length > 0"
    class="space-y-3"
>
    <div class="flex flex-col gap-2 border-b border-border pb-3 sm:flex-row sm:items-center sm:justify-between">
        <div class="text-xs text-muted-foreground">
            {{ filteredConnections.length }} of {{ connections.length }} connections
        </div>
        <div class="flex flex-wrap gap-2">
            <select
                class="ui-input h-8 w-40 text-xs"
                [(ngModel)]="selectedDbType"
                (change)="onFilterChange()"
            >
                <option value="">All Types</option>
                <option
                    *ngFor="let type of availableDbTypes"
                    [value]="type"
                >
                    {{ getDbTypeLabel(type) }}
                </option>
            </select>
            <select
                class="ui-input h-8 w-32 text-xs"
                [(ngModel)]="selectedStatus"
                (change)="onFilterChange()"
            >
                <option value="">All Status</option>
                <option value="recent">Recently Used</option>
                <option value="available">Available</option>
                <option value="connected">Connected</option>
            </select>
            <select
                class="ui-input h-8 w-32 text-xs"
                [(ngModel)]="sortBy"
                (change)="onSortChange()"
            >
                <option value="name">Sort: Name</option>
                <option value="type">Sort: Type</option>
                <option value="recent">Sort: Recent</option>
                <option value="created">Sort: Created</option>
            </select>
            <button
                type="button"
                class="btn btn-ghost btn-sm"
                (click)="clearFilters()"
            >
                Clear Filters
            </button>
        </div>
    </div>

    <!-- Grid -->
    <div
        *ngIf="filteredConnections.length > 0"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
    >
        <app-connection-card
            *ngFor="let conn of filteredConnections; trackBy: trackByConnectionId"
            [connection]="conn"
            (onSelect)="onConnectionSelect.emit($event)"
            (onEdit)="onEditConnection($event)"
            (onDelete)="onDeleteConnection($event)"
            (onTest)="onTestConnection($event)"
        ></app-connection-card>
    </div>

    <!-- No matches -->
    <div
        *ngIf="filteredConnections.length === 0"
        class="text-center py-10"
    >
        <div class="text-muted-foreground max-w-md mx-auto">
            <span class="icon-[mdi--filter-variant] h-12 w-12 mx-auto mb-4"></span>
            <h3 class="text-lg font-medium text-foreground mb-2">No matching connections</h3>
            <p class="text-sm text-muted-foreground">
                Try adjusting your filters to see more connections.
            </p>
            <button
                (click)="clearFilters()"
                class="btn btn-secondary btn-sm mt-4"
            >
                Clear Filters
            </button>
        </div>
    </div>
</div>
