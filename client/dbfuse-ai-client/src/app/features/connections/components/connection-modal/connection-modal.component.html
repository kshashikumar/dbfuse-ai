<div
    *ngIf="isOpen"
    class="fixed inset-0 z-[10004] flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm"
    (click)="cancel()"
    aria-labelledby="modal-title"
    role="dialog"
    aria-modal="true"
>
    <div
        class="relative ui-card w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden"
        (click)="$event.stopPropagation()"
    >
        <div class="flex items-center justify-between border-b border-border px-6 py-4">
            <div>
                <h3
                    class="text-lg font-semibold text-foreground"
                    id="modal-title"
                >
                    {{ connection.id ? 'Edit Connection' : 'New Connection' }}
                </h3>
                <p class="text-xs text-muted-foreground">Add your database details to save the connection.</p>
            </div>
            <button
                type="button"
                (click)="cancel()"
                class="btn btn-ghost btn-sm"
            >
                <span class="sr-only">Close</span>
                <span class="icon-[mdi--close] h-5 w-5"></span>
            </button>
        </div>

        <div class="flex-1 min-h-0 overflow-auto scrollbar-hidden px-6 py-4 space-y-4">
            <!-- Validation Errors -->
            <div
                *ngIf="!validationResult.isValid && validationResult.errors.length > 0"
                class="rounded-lg border border-destructive/30 bg-destructive/10 p-3 text-destructive"
            >
                <div class="flex items-start gap-2">
                    <span class="icon-[mdi--alert] h-5 w-5"></span>
                    <div class="text-sm">
                        <ul class="list-disc list-inside">
                            <li *ngFor="let error of validationResult.errors">{{ error }}</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Validation Warnings -->
            <div
                *ngIf="validationResult.warnings && validationResult.warnings.length > 0"
                class="rounded-lg border border-amber-200 bg-amber-50 p-3 text-amber-800 dark:border-amber-800/60 dark:bg-amber-900/20 dark:text-amber-200"
            >
                <div class="flex items-start gap-2">
                    <span class="icon-[mdi--alert-outline] h-5 w-5"></span>
                    <div class="text-sm">
                        <ul class="list-disc list-inside">
                            <li *ngFor="let warning of validationResult.warnings">{{ warning }}</li>
                        </ul>
                    </div>
                </div>
            </div>

            <form
                [formGroup]="connectionForm"
                class="space-y-6"
            >
                <!-- Basic Configuration -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b border-border pb-2">
                        <h4 class="text-sm font-semibold text-foreground">Basic Configuration</h4>
                        <span class="text-xs text-muted-foreground">Required fields</span>
                    </div>

                    <div class="grid gap-4 md:grid-cols-2">
                            <!-- Database Type -->
                            <div class="md:col-span-2">
                                <label
                                    for="dbType"
                                    class="block text-sm font-medium text-muted-foreground mb-2"
                                >
                                    Database Type *
                                </label>
                                <select
                                    id="dbType"
                                    formControlName="dbType"
                                    class="ui-input w-full mt-1"
                                >
                                    <option
                                        *ngFor="let type of dbTypes"
                                        [value]="type"
                                    >
                                        {{ getDbTypeLabel(type) }}
                                    </option>
                                </select>
                            </div>

                            <!-- Dynamic Basic Fields -->
                            <div
                                *ngFor="let field of getFieldsByGroup('basic'); trackBy: trackByFieldName"
                                class="space-y-2"
                            >
                                <div *ngIf="shouldShowField(field.name, 'basic')">
                                    <label
                                        [for]="field.name"
                                        class="block text-sm font-medium text-muted-foreground mb-2"
                                    >
                                        {{ field.label }}
                                        <span
                                            *ngIf="field.required"
                                            class="text-red-500"
                                            >*</span
                                        >
                                    </label>

                                    <!-- Text/Number/Password Input (with password toggle) -->
                                    <div
                                        *ngIf="
                                            field.type === 'text' ||
                                            field.type === 'number' ||
                                            field.type === 'password'
                                        "
                                        class="relative"
                                    >
                                        <input
                                            [type]="
                                                field.name === 'password'
                                                    ? showPassword
                                                        ? 'text'
                                                        : 'password'
                                                    : field.type
                                            "
                                            [id]="field.name"
                                            [formControlName]="field.name"
                                            [placeholder]="field.placeholder || ''"
                                            class="ui-input w-full mt-1"
                                            [class.pr-10]="field.name === 'password'"
                                        />

                                        <!-- Password Toggle Button -->
                                        <button
                                            *ngIf="field.name === 'password'"
                                            type="button"
                                            (click)="togglePasswordVisibility()"
                                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-muted-foreground hover:text-foreground"
                                        >
                                            <span
                                                *ngIf="!showPassword"
                                                class="icon-[mdi--eye] h-5 w-5"
                                            ></span>
                                            <span
                                                *ngIf="showPassword"
                                                class="icon-[mdi--eye-off] h-5 w-5"
                                            ></span>
                                        </button>
                                    </div>

                                    <!-- Checkbox -->
                                    <div
                                        *ngIf="field.type === 'checkbox'"
                                        class="flex items-center"
                                    >
                                        <input
                                            type="checkbox"
                                            [id]="field.name"
                                            [formControlName]="field.name"
                                            class="h-4 w-4 rounded border-border text-primary focus:ring-ring"
                                        />
                                        <label
                                            [for]="field.name"
                                            class="ml-2 block text-sm text-foreground"
                                        >
                                            {{ field.label }}
                                        </label>
                                    </div>

                                    <!-- Select -->
                                    <select
                                        *ngIf="field.type === 'select'"
                                        [id]="field.name"
                                        [formControlName]="field.name"
                                        class="ui-input w-full mt-1"
                                    >
                                        <option value="">Select {{ field.label }}</option>
                                        <option
                                            *ngFor="let option of getSelectOptions(field.name)"
                                            [value]="option"
                                        >
                                            {{ option }}
                                        </option>
                                    </select>

                                    <!-- Field Error -->
                                    <div
                                        *ngIf="getFieldError(field.name)"
                                        class="text-destructive text-xs mt-1"
                                    >
                                        {{ getFieldError(field.name) }}
                                    </div>
                                </div>
                            </div>
                        </div>
                        </div>

                        <!-- Security Configuration -->
                        <div
                            *ngIf="getFieldsByGroup('security').length > 0"
                            class="space-y-4"
                        >
                            <div class="flex items-center justify-between border-b border-border pb-2">
                                <h4 class="text-sm font-semibold text-foreground">Security Settings</h4>
                                <span class="text-xs text-muted-foreground">Optional</span>
                            </div>

                            <div class="grid gap-4 md:grid-cols-2">
                                <div
                                    *ngFor="let field of getFieldsByGroup('security'); trackBy: trackByFieldName"
                                    class="space-y-2"
                                >
                                    <div *ngIf="shouldShowField(field.name, 'security')">
                                        <label
                                            [for]="field.name"
                                            class="block text-sm font-medium text-muted-foreground mb-2"
                                        >
                                            {{ field.label }}
                                        </label>

                                        <div [ngSwitch]="field.type">
                                            <input
                                                *ngSwitchCase="'text'"
                                                type="text"
                                                [id]="field.name"
                                                [formControlName]="field.name"
                                                class="ui-input w-full mt-1"
                                            />

                                            <div
                                                *ngSwitchCase="'checkbox'"
                                                class="flex items-center"
                                            >
                                                <input
                                                    type="checkbox"
                                                    [id]="field.name"
                                                    [formControlName]="field.name"
                                                    class="h-4 w-4 rounded border-border text-primary focus:ring-ring"
                                                />
                                                <label
                                                    [for]="field.name"
                                                    class="ml-2 block text-sm text-foreground"
                                                >
                                                    {{ field.label }}
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Advanced Configuration -->
                        <div
                            *ngIf="getFieldsByGroup('advanced').length > 0"
                            class="space-y-4"
                        >
                            <div class="flex items-center justify-between">
                                <h4 class="text-sm font-semibold text-foreground">Advanced Settings</h4>
                                <button
                                    type="button"
                                    (click)="toggleAdvanced()"
                                    class="text-xs text-primary hover:text-primary/80"
                                >
                                    {{ showAdvanced ? 'Hide' : 'Show' }} Advanced
                                </button>
                            </div>

                            <div
                                *ngIf="showAdvanced"
                                class="space-y-4 pl-4 border-l-2 border-border"
                            >
                                <div class="grid gap-4 md:grid-cols-2">
                                    <div
                                        *ngFor="let field of getFieldsByGroup('advanced'); trackBy: trackByFieldName"
                                        class="space-y-2"
                                    >
                                        <div *ngIf="shouldShowField(field.name, 'advanced')">
                                            <label
                                                [for]="field.name"
                                                class="block text-sm font-medium text-muted-foreground mb-2"
                                            >
                                                {{ field.label }}
                                            </label>

                                            <div [ngSwitch]="field.type">
                                                <input
                                                    *ngSwitchCase="'text'"
                                                    type="text"
                                                    [id]="field.name"
                                                    [formControlName]="field.name"
                                                    class="ui-input w-full mt-1"
                                                />

                                                <input
                                                    *ngSwitchCase="'number'"
                                                    type="number"
                                                    [id]="field.name"
                                                    [formControlName]="field.name"
                                                    class="ui-input w-full mt-1"
                                                />

                                                <div
                                                    *ngSwitchCase="'checkbox'"
                                                    class="flex items-center"
                                                >
                                                    <input
                                                        type="checkbox"
                                                        [id]="field.name"
                                                        [formControlName]="field.name"
                                                        class="h-4 w-4 rounded border-border text-primary focus:ring-ring"
                                                    />
                                                    <label
                                                        [for]="field.name"
                                                        class="ml-2 block text-sm text-foreground"
                                                    >
                                                        {{ field.label }}
                                                    </label>
                                                </div>

                                                <select
                                                    *ngSwitchCase="'select'"
                                                    [id]="field.name"
                                                    [formControlName]="field.name"
                                                    class="ui-input w-full mt-1"
                                                >
                                                    <option value="">Select {{ field.label }}</option>
                                                    <option
                                                        *ngFor="let option of getSelectOptions(field.name)"
                                                        [value]="option"
                                                    >
                                                        {{ option }}
                                                    </option>
                                                </select>
                                            </div>

                                            <div
                                                *ngIf="field.hint"
                                                class="text-xs text-muted-foreground mt-1"
                                            >
                                                {{ field.hint }}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                </form>
        </div>

        <!-- Action buttons -->
        <div class="border-t border-border px-6 py-4 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <button
                type="button"
                (click)="cancel()"
                class="btn btn-secondary w-full sm:w-auto"
            >
                Cancel
            </button>
            <button
                type="button"
                (click)="save()"
                [disabled]="!isFormValid()"
                class="btn btn-primary w-full sm:w-auto"
            >
                {{ connection.id ? 'Update' : 'Create' }}
            </button>
        </div>
    </div>
</div>
