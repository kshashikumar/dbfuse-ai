<ng-container [ngSwitch]="dbType">
    <app-mongodb-explorer
        *ngSwitchCase="'mongodb'"
        [dbType]="dbType"
        [databases]="databases"
    ></app-mongodb-explorer>
    <app-redis-explorer
        *ngSwitchCase="'redis'"
        [dbType]="dbType"
        [databases]="databases"
    ></app-redis-explorer>
    <app-nosql-explorer
        *ngSwitchDefault
        [dbType]="dbType"
        [databases]="databases"
    ></app-nosql-explorer>
</ng-container>
