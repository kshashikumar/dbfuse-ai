<div class="ui-shell flex h-full flex-col overflow-hidden">

    <!-- Navbar -->
    <app-navbar (aiEnabledEmitter)="handleOpenAIEvent($event)"></app-navbar>

    <!-- Main Content Area -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Thin Navigation Bar -->
        <div class="flex flex-col w-14 border-r border-border bg-background p-2 gap-2 items-center">
            <button
                (click)="setActiveView('explorer')"
                class="h-11 w-11 flex items-center justify-center rounded-md text-muted-foreground hover:text-foreground hover:bg-muted transition-colors"
                [ngClass]="{
                    'bg-muted text-foreground': activeView === 'explorer'
                }"
                aria-label="Explorer"
            >
                <span class="icon-[mdi--database] w-5 h-5"></span>
            </button>
            <button
                (click)="setActiveView('chat')"
                class="h-11 w-11 flex items-center justify-center rounded-md text-muted-foreground hover:text-foreground hover:bg-muted transition-colors"
                [ngClass]="{
                    'bg-muted text-foreground': activeView === 'chat'
                }"
                aria-label="Chat to DB"
            >
                <span class="icon-[mdi--message-processing-outline] w-5 h-5"></span>
            </button>
        </div>

        <!-- Sidebar -->
        <div
            *ngIf="activeView === 'explorer' && isSqlBased"
            class="flex-shrink-0 w-80 h-full border-r border-border bg-background overflow-hidden"
        >
            <app-sidebar
                class="h-full"
                (newTabEmitter)="handleNewTabData($event)"
                (initDBInfoEmitter)="handleInitData($event)"
            ></app-sidebar>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden min-w-0 min-h-0">
            <main class="flex-1 overflow-hidden bg-background min-h-0">
                <app-home
                    *ngIf="activeView === 'explorer' && isSqlBased"
                    class="h-full"
                    [tabData]="tabData"
                    [InitDBInfo]="databases"
                    [openAIEnabled]="openAIEnabledFlag"
                    [pendingQuery]="pendingQuery"
                ></app-home>
                <app-nosql-explorer-shell
                    *ngIf="activeView === 'explorer' && !isSqlBased"
                    class="h-full"
                    [dbType]="effectiveDbType"
                    [databases]="databases"
                ></app-nosql-explorer-shell>
                <app-chat-host
                    *ngIf="activeView === 'chat'"
                    class="h-full"
                    (sendToEditor)="handleChatSendToEditor($event)"
                ></app-chat-host>
            </main>
        </div>
    </div>
</div>
